apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture
spec:
  template:
    spec:
      containers:
        - name: controller
          image: example/controller:1.2.3
          args:
            - --listen-address=:8080
            {{- if and .Values.replication.enabled .Values.replication.tls.enabled }}
            - --peer-ca-file=/var/run/trust-bundle/ca.pem
            {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - mountPath: /var/run/trust-bundle
              name: trust-bundle
              readOnly: true
          {{- end }}
        - name: metrics-sidecar
          image: example/metrics:1.2.3
          volumeMounts:
            - name: trust-bundle
              mountPath: /var/run/trust-bundle
      volumes:
        - name: trust-bundle
          secret:
            secretName: fixture-trust
